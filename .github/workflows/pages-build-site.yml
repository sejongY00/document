name: Deploy office editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # x2t.wasm.br holds Brotli bytes that only work when the host sends Content-Encoding: br
      # (ranuts' Cloudflare _headers). GitHub Pages cannot, so the browser got compressed bytes
      # ("expected magic word 00 61 73 6d"). Store the plain WASM under the same name instead:
      # Emscripten falls back to ArrayBuffer instantiation when the MIME type is not
      # application/wasm. Must run before the build fingerprints the vendor tree.
      - name: Decompress x2t WASM for GitHub Pages
        run: |
          node -e '
            const fs = require("fs"), zlib = require("zlib");
            const p = "public/sdkjs/common/wasm/x2t/x2t.wasm.br";
            const wasm = zlib.brotliDecompressSync(fs.readFileSync(p));
            if (!wasm.subarray(0, 4).equals(Buffer.from([0, 97, 115, 109]))) throw new Error("not WASM");
            fs.writeFileSync(p, wasm);
            console.log("x2t WASM stored uncompressed:", wasm.length, "bytes");
          '

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm -r run prepare
          pnpm run build

      # GitHub Pages ignores _headers/_redirects; serve index.html for unknown routes instead.
      - name: SPA fallback and custom domain
        run: |
          cp dist/index.html dist/404.html
          echo "editor.sejong.dev" > dist/CNAME

      - name: Report size
        run: |
          du -sh dist
          find dist -type f -size +50M -exec ls -la {} \;

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
